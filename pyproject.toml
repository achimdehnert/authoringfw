[project]
name = "iil-authoringfw"
version = "0.11.5"
description = "Authoring Framework — domain schemas and orchestration base for AI-assisted creative writing"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Achim Dehnert", email = "achim@dehnert.com"}
]
keywords = ["llm", "authoring", "creative-writing", "ai", "story", "schema", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",  # runtime: content_types loads StyleProfile from YAML (eager via __init__)
]

[project.optional-dependencies]
aifw = [
    "iil-aifw>=0.11.4",  # quality_level/priority routing only works from 0.11.2 (was silently ignored before)
]
yaml = [
    "pyyaml>=6.0",
]
promptfw = [
    "iil-promptfw>=0.5.5",
]
all = [
    "pyyaml>=6.0",
    "iil-aifw>=0.11.4",  # quality_level/priority routing only works from 0.11.2 (was silently ignored before)
    "iil-promptfw>=0.5.5",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4",
]
testing = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/achimdehnert/authoringfw"
Repository = "https://github.com/achimdehnert/authoringfw"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authoringfw"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

# Coverage is scoped to the package source only (NOT tests/).
# Before this scope was set, bare `--cov` measured tests/ + src together and
# reported an inflated ~85%. The honest, source-scoped number is ~72%.
# fail_under is a no-regression floor at the real current level; the target is
# 80% — raise this gate as coverage improves (do not lower it).
[tool.coverage.run]
source = ["authoringfw"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py312"
